[package]
name = "vk-xss-replay"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5.2", features = ["validate-request"] }
url = "2.5.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.23.0", features = ["serde"] }
relay-client = { path = "../vibe-kanban-V2/relay_client_shim" }

# standalone; never attach to another workspace
[workspace]
